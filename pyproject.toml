[project]
name = "nombre-del-proyecto"
version = "0.1.0"
description = "Completar"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errores básicos · I: orden de imports · B: bugs comunes · UP: Python moderno
# SIM: simplificaciones · S: seguridad (reglas de bandit) · N: nombres
select = ["E", "F", "I", "B", "UP", "SIM", "S", "N"]

[tool.ruff.lint.per-file-ignores]
# En los tests se usa assert y se ejecutan subprocesos a propósito.
"tests/**" = ["S101", "S603", "S607"]
# Los hooks llaman a git con argumentos fijos.
".claude/hooks/**" = ["S603", "S607"]

[tool.mypy]
files = ["src", ".claude/hooks"]
strict = true
